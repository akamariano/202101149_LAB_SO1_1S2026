# This rule is not used by the project mumnk8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mumnk8s.so1.usac.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mumnk8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafanainstance-editor-role
rules:
- apiGroups:
  - mumnk8s.so1.usac
  resources:
  - grafanainstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mumnk8s.so1.usac
  resources:
  - grafanainstances/status
  verbs:
  - get
