# Escala rust-api de 1 a 3 réplicas cuando el promedio de CPU supera el 30 %.
# El porcentaje es sobre requests.cpu (100m), o sea que el umbral es unos 30m por pod.
# metrics-server (incluido en GKE) le entrega al HPA el consumo de cada pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rust-api
  namespace: mumnk8s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rust-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
