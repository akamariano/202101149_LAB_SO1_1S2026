# Instancia de Grafana declarada como Custom Resource. El mismo operador mumnk8s la
# reconcilia con el chart helm-charts/grafanainstance: Deployment, Service y ConfigMaps
# con el datasource de Valkey y el dashboard ya provisionados.
# Requiere: operador instalado, CR ValkeyInstance "valkey" y scripts/40_grafana_secret.sh.
apiVersion: mumnk8s.so1.usac/v1alpha1
kind: GrafanaInstance
metadata:
  name: grafana
  namespace: mumnk8s
spec:
  valkey:
    address: valkey:6379
  adminSecret: grafana-admin
  dashboard:
    country: GTM
    carnet: "202101149"
    refresh: 5s
