# RabbitMQ: broker principal. StatefulSet (y no Deployment) porque tiene estado:
#   - identidad estable: el pod siempre se llama rabbitmq-0 y RabbitMQ guarda sus datos
#     bajo el nombre del nodo (rabbit@rabbitmq-0)
#   - un PVC propio que se conserva si el pod se reinicia o se reprograma en otro nodo
# Las credenciales vienen del Secret rabbitmq-cred (scripts/30_rabbitmq_secret.sh).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: mumnk8s
  labels: { app: rabbitmq }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: 34-45-250-177.sslip.io/mumnk8s/rabbitmq:4.1-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: rabbitmq-cred, key: username } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: rabbitmq-cred, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          # Los comandos de diagnóstico tardan unos segundos, por eso los timeouts amplios
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: mumnk8s
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
