apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.name" . }}-config
  labels: {{- include "valkey.labels" . | nindent 4 }}
data:
  # appendonly: cada escritura va al log AOF en el PVC; tras un reinicio se reconstruyen los datos
  valkey.conf: |
    bind 0.0.0.0
    protected-mode no
    dir /data
    appendonly yes
    appendfsync everysec
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.maxmemoryPolicy }}
